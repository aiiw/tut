<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>教程目录首页</title>
<style>
*{box-sizing:border-box;font-family:system-ui, sans-serif;margin:0;padding:0}
body{max-width:860px;margin:3rem auto;padding:0 20px;color:#222}
h1{margin-bottom:24px;font-size:28px}
.loading{color:#666}

.group{margin:28px 0;}
.group h2{font-size:20px;margin-bottom:12px;padding-bottom:6px;border-bottom:1px solid #ddd;}
ul{list-style:none}
li{margin:10px 0;padding:6px 0;}
a{font-size:17px;color:#0366d6;text-decoration:none}
a:hover{text-decoration:underline}

.tip{margin-top:30px;color:#555;font-size:14px}
.tag{
    display:inline-block;
    font-size:12px;
    padding:2px 6px;
    border-radius:4px;
    margin-left:8px;
    color:#fff;
}
.tag-html{background:#2563eb;}
.tag-md{background:#10b981;}
.tag-pdf{background:#ef4444;}
.tag-ppt{background:#f97316;}

.toggle-btn{
    margin:8px 0 8px 4px;
    padding:4px 10px;
    font-size:14px;
    border:1px solid #ccc;
    border-radius:4px;
    background:#f7f7f7;
    cursor:pointer;
}
.toggle-btn:hover{background:#eee;}
.hidden-item{display:none;}
</style>
</head>
<body>
<h1>📖 教程目录</h1>
<div id="list" class="loading">正在加载文档列表……</div>
<p class="tip">提示：往仓库上传 html/md/pdf/ppt/pptx 文件，刷新本页面即可自动新增链接。每个分类默认最多展示前10条。</p>

<script>
const repoOwner = "aiiw";
const repoName = "tut"; // 务必替换为真实仓库名
const branch = "main";
const SHOW_MAX = 10; // 每个栏目默认展示条数

const allowExtMap = [
  {ext:".html", title:"HTML栏目", cls:"tag-html"},
  {ext:".md", title:"MD栏目", cls:"tag-md"},
  {ext:".pdf", title:"PDF栏目", cls:"tag-pdf"},
  {ext:".ppt", title:"PPT栏目", cls:"tag-ppt"},
  {ext:".pptx", title:"PPT栏目", cls:"tag-ppt"},
];

// 获取文件所属分组
function getGroupInfo(path){
    const lp = path.toLowerCase();
    for(let g of allowExtMap){
        if(lp.endsWith(g.ext)) return g;
    }
    return null;
}

async function loadHtmlFiles() {
  const resp = await fetch(`https://api.github.com/repos/${repoOwner}/${repoName}/git/trees/${branch}?recursive=1`);
  const data = await resp.json();

  if (!data.tree) {
    return `<p>读取仓库文件失败：${data.message || '未知错误'}</p>`;
  }

  // 过滤得到有效文件
  const rawFiles = data.tree.filter(item=>{
      if(item.type !== "blob") return false; // 排除文件夹
      if(item.path === "index.html") return false;
      return getGroupInfo(item.path) !== null;
  }).sort((a, b) => a.path.localeCompare(b.path));

  if (rawFiles.length === 0) {
    return '<p>暂无文档，上传 html/md/pdf/ppt/pptx 文件后刷新页面</p>';
  }

  // 按分组归类
  const groups = {};
  for(let f of rawFiles){
      const ginfo = getGroupInfo(f.path);
      if(!groups[ginfo.title]){
          groups[ginfo.title] = {cls:ginfo.cls, items:[]};
      }
      groups[ginfo.title].items.push(f);
  }

  let html = "";
  let groupIndex = 0;
  for(let groupTitle in groups){
      groupIndex++;
      const g = groups[groupTitle];
      const allItems = g.items;
      const showItems = allItems.slice(0,SHOW_MAX);
      const hideItems = allItems.slice(SHOW_MAX);
      const groupId = "group-"+groupIndex;

      html += `<div class="group"><h2>${groupTitle}（共${allItems.length}个）</h2><ul id="${groupId}">`;

      // 渲染前N条
      for(const file of showItems){
        html += `<li><a href="${file.path}">${file.path}</a><span class="tag ${g.cls}">${groupTitle.replace("栏目","")}</span></li>`;
      }
      // 渲染隐藏条目，加 hidden-item
      for(const file of hideItems){
        html += `<li class="hidden-item hide-${groupId}"><a href="${file.path}">${file.path}</a><span class="tag ${g.cls}">${groupTitle.replace("栏目","")}</span></li>`;
      }
      html += `</ul>`;

      // 如果存在隐藏项，增加切换按钮
      if(hideItems.length>0){
        html += `<button class="toggle-btn" data-target="${groupId}" data-shown="false">显示全部（+${hideItems.length}）</button>`;
      }
      html += `</div>`;
  }
  return html;
}

loadHtmlFiles().then(html => {
  document.getElementById('list').innerHTML = html;

  // 绑定展开/收起事件
  document.querySelectorAll(".toggle-btn").forEach(btn=>{
      btn.onclick = function(){
          const targetId = this.dataset.target;
          const isShown = this.dataset.shown === "true";
          const hideClass = "hide-"+targetId;
          const els = document.querySelectorAll("."+hideClass);
          if(!isShown){
              els.forEach(el=>el.classList.remove("hidden-item"));
              this.innerText = "收起";
              this.dataset.shown = "true";
          }else{
              els.forEach(el=>el.classList.add("hidden-item"));
              const more = els.length;
              this.innerText = `显示全部（+${more}）`;
              this.dataset.shown = "false";
          }
      }
  })

}).catch(err => {
  document.getElementById('list').innerText = "加载异常：" + err;
})
</script>
</body>
</html>
